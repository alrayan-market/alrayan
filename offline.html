<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد اتصال — منصة الريان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,sans-serif;background:linear-gradient(160deg,#1A2744,#2A3C63);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
.box{max-width:340px}
.ico{font-size:4rem;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:900;margin-bottom:10px}
p{color:#C6CFDF;font-size:0.9rem;line-height:1.7;margin-bottom:22px}
button{background:linear-gradient(100deg,#F2CE73,#D9A840);color:#12203A;border:none;border-radius:100px;padding:13px 30px;font-weight:900;font-size:0.95rem;cursor:pointer;font-family:inherit}
.hint{margin-top:18px;color:rgba(255,255,255,.5);font-size:0.78rem;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <div class="ico">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر الوصول إلى منصة الريان. تأكد من اتصالك بالشبكة ثم أعد المحاولة.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
  <div class="hint">تأكد من تشغيل بيانات الجوال أو الواي فاي</div>
</div>
</body>
</html>
